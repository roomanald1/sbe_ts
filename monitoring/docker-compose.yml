services:
  service-control:
    build: ../system/control
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WORKSPACE_ROOT: /workspace
      DOCKER_WORKSPACE_ROOT: ${REPO_ROOT:-..}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_ROOT:-..}:/workspace
      - ${REPO_ROOT:-..}/src/typescript/workspace/apps/react-app/public/coverage:/app/coverage:ro
      - ${REPO_ROOT:-..}/src/typescript/workspace/apps/benchmarks/dist:/app/benchmarks:ro
    depends_on:
      - benchmarks-ui
    command: ["node", "--watch", "/workspace/system/control/server.mjs"]
    restart: unless-stopped

  benchmarks-ui:
    build: { context: .., dockerfile: system/Dockerfile.web }
    working_dir: /app/apps/benchmarks
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5175", "--strictPort"]
    volumes:
      - ${REPO_ROOT:-..}/src/typescript/workspace/apps/benchmarks:/app/apps/benchmarks
      - ${REPO_ROOT:-..}/research:/research:ro
    ports:
      - "127.0.0.1:5175:5175"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus-config/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus-config:/etc/prometheus-config:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy-config/config.alloy
    depends_on:
      - loki
    volumes:
      - ./alloy:/etc/alloy-config:ro
      - ../logs:/var/log/app:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped

  app-exporter:
    build: ./exporter
    environment:
      POSITION_MANAGEMENT_URL: http://host.docker.internal:3002
      AUTO_TRADER_URL: http://host.docker.internal:3005
      FEED_HANDLERS_URL: http://host.docker.internal:3001
      EXECUTION_URL: http://host.docker.internal:3003
      INSIGHTS_URL: http://host.docker.internal:3004
      LIVE_SIGNALS_URL: http://host.docker.internal:3007
      NEWS_SENTIMENT_URL: http://host.docker.internal:3006
      LEARNING_SERVICE_URL: http://host.docker.internal:3010
      SCOUTS_SERVICE_URL: http://host.docker.internal:3011
      SQLITE_DB_PATHS: /data/insights/signals.sqlite:/data/position_management/auto_trader_state.sqlite:/data/learning/learning_state.sqlite
      PERSISTENT_STORE_PATHS: /data/position_management/positions.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - insights-data:/data/insights:ro
      - position-management-data:/data/position_management:ro
      - learning-data:/data/learning:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  insights-data:
    external: true
    name: sbe-insights-data
  position-management-data:
    external: true
    name: sbe-position-management-data
  learning-data:
    external: true
    name: sbe-learning-data
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
