services:
  service-control:
    build: ../system/control
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WORKSPACE_ROOT: /workspace
      DOCKER_WORKSPACE_ROOT: ${REPO_ROOT:-..}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_ROOT:-..}:/workspace
      - ${REPO_ROOT:-..}/system/control:/app
      - ${REPO_ROOT:-..}/src/typescript/workspace/apps/react-app/public/coverage:/app/coverage:ro
    command: ["node", "--watch", "server.mjs"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../logs:/var/log/app:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped

  app-exporter:
    build: ./exporter
    environment:
      POSITION_MANAGEMENT_URL: http://host.docker.internal:3002
      AUTO_TRADER_URL: http://host.docker.internal:3005
      FEED_HANDLERS_URL: http://host.docker.internal:3001
      EXECUTION_URL: http://host.docker.internal:3003
      INSIGHTS_URL: http://host.docker.internal:3004
      NEWS_SENTIMENT_URL: http://host.docker.internal:3006
      LEARNING_SERVICE_URL: http://host.docker.internal:3010
      SCOUTS_SERVICE_URL: http://host.docker.internal:3011
      SQLITE_DB_PATH: /workspace/src/rust/insights/signals.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${REPO_ROOT:-..}:/workspace:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
