[package]
name = "live_signals"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
dashmap = "6.1.0"
futures-util = "0.3.34"
libc = "0.2"
reqwest = { version = "0.13.5", features = ["json"] }
rsocket_rust = "0.7.5"
rsocket_rust_transport_websocket = "0.7.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
insights = { path = "../insights" }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
