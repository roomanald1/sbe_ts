[package]
name = "auto_trader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
dashmap = "6.1.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
