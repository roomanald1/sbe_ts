[package]
name = "auto_trader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dashmap = "6.1.0"
futures-util = "0.3.34"
rmp-serde = "1.3.1"
rusqlite = { version = "0.38", features = ["bundled"] }
rsocket_rust = "0.7.5"
rsocket_rust_transport_websocket = "0.7.4"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"
strategy = { path = "../strategy" }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1.5"
learning = { path = "../learning" }
position_management = { path = "../position_management", features = ["test-support"] }

[[bench]]
name = "strategy_evaluation"
harness = false
[patch.crates-io]
rsocket_rust = { path = "../vendor/rsocket_rust" }
