[package]
name = "strategies"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rsocket_rust = "0.7.5"
rsocket_rust_transport_websocket = "0.7.4"

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

