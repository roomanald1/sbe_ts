[package]
name = "position_management"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.7.1"
execution = { path = "../execution" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
reqwest = { version = "0.13.5", features = ["json"] }
rmp-serde = "1.3.1"
rusqlite = { version = "0.38", features = ["bundled"] }
rsocket_rust = "0.7.5"
rsocket_rust_transport_websocket = "0.7.4"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "ledger_io"
harness = false

[[bench]]
name = "position_summary"
harness = false

[[bench]]
name = "ledger_concurrency"
harness = false

[[bench]]
name = "service_http"
harness = false
