[package]
name = "rust_sbe_publisher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
futures-util = "0.3.34"
reqwest = "0.13.5"
rsocket_rust = "0.7.5"
rsocket_rust_transport_websocket = "0.7.4"
sbe_schema = { package = "example", path = "src/sbe/sbe_out/example" }
serde = { version= "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
tokio = "1.53.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
