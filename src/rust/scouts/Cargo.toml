[package]
name = "scouts"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
libc = "0.2"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strategies = { path = "../strategies" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }

