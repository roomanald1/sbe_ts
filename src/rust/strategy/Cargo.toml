[package]
name = "strategy"
version = "0.1.0"
edition = "2024"

[lib]
name = "strategy"

[[bin]]
name = "strategy"
path = "src/bin/strategy.rs"
required-features = ["service"]

[features]
default = []
service = [
    "dep:axum",
    "dep:futures-util",
    "dep:http-body-util",
    "dep:http",
    "dep:libc",
    "dep:rusqlite",
    "dep:sha2",
    "dep:tokio",
    "dep:tower",
]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", optional = true }
http-body-util = { version = "0.1.5", optional = true }
http = { version = "1.3", optional = true }
libc = { version = "0.2", optional = true }
futures-util = { version = "0.3.32", optional = true }
rsocket_rust = "0.7.5"
rsocket_rust_transport_websocket = "0.7.4"
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.10.9", optional = true }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
