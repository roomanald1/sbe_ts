[package]
name = "learning"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.38", features = ["bundled"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
http = "1.3"
 tower = { version = "0.5.3", features = ["util"] }
rsocket_rust = "0.7.5"
rsocket_rust_transport_websocket = "0.7.4"
strategies = { path = "../strategies" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]


[[bench]]
name = "learning_service"
harness = false
