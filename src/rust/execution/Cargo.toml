[package]
name = "execution"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bytes = "1.12.1"
futures-util = "0.3.34"
rsocket_rust = "0.7.5"
rsocket_rust_transport_websocket = "0.7.4"
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }

[[bench]]
name = "vwap_execution"
harness = false

[[bench]]
name = "vwap_market_workload"
harness = false
