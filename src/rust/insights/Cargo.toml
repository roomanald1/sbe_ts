[package]
name = "insights"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
dashmap = "6.1.0"
rsocket_rust_transport_websocket = "0.7.4"
rsocket_rust = "0.7.5"
futures-util = "0.3.34"
bytes = "1.12.1"
anyhow = "1.0.104"
flate2 = "1.1"
bincode = "1.3"
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time", "process"] }