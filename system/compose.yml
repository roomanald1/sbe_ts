    environment: { <<: *strategy-x-scout-env, STRATEGY_X_WORKER_STRATEGY: live-order-book, SCOUT_WORKER_STATE_PATH: /data/workers/live-order-book.sqlite }
  strategy-x-live-vwap-dislocation:
