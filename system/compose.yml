name: sbe-system
x-scout-worker-env: &scout-worker-env
  SCOUT_WORKER_LISTEN_ADDR: 0.0.0.0:10200
  SCOUT_WORKER_MAX_IN_FLIGHT: ${SCOUT_WORKER_MAX_IN_FLIGHT:-1}
  SCOUT_WORKER_MAX_PAYLOAD_BYTES: ${SCOUT_WORKER_MAX_PAYLOAD_BYTES:-1048576}
  SCOUT_WORKER_MAX_PERSISTED_RESULTS: ${SCOUT_WORKER_MAX_PERSISTED_RESULTS:-10000}
  LEARNING_RSOCKET_URL: ws://learning:10010
  INSIGHTS_RPC_RSOCKET_URL: ws://insights:10007
  AUTO_TRADER_RSOCKET_URL: ws://auto-trader:10006
x-scout-worker-base: &scout-worker-base
  build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: scouts, BIN: scouts } }
  profiles: [scout-workers]
  volumes: ["scouts-state:/data"]
  depends_on: [learning, insights, auto-trader]
  deploy:
    resources:
      limits:
        cpus: ${SCOUT_WORKER_CPU_LIMIT:-0.75}
        memory: ${SCOUT_WORKER_MEMORY_LIMIT:-2G}
  restart: unless-stopped
  healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/10200"], interval: 15s, timeout: 3s, retries: 5 }
services:
  feed-handlers:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: feed_handlers, BIN: feed_handlers } }
    environment: { SERVICE_LOG_DIR: /var/log/app }
    volumes: ["../logs:/var/log/app"]
    ports: ["3001:3001", "10001:10001"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3001"], interval: 15s, timeout: 3s, retries: 5 }
  binance-feed:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: binance_feed, BIN: binance_feed } }
    environment: { SERVICE_LOG_DIR: /var/log/app, PORT: 3012, RSOCKET_PORT: 10002 }
    volumes: ["../logs:/var/log/app"]
    ports: ["3012:3012"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3012"], interval: 15s, timeout: 3s, retries: 5 }
  position-management:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: position_management, BIN: position_management } }
    environment: { SERVICE_LOG_DIR: /var/log/app, FEED_HANDLERS_RSOCKET_URL: ws://feed-handlers:10001, POSITION_MANAGEMENT_RSOCKET_PORT: 10005, POSITIONS_FILE: /data/positions.json }
    volumes: ["../logs:/var/log/app", "position-management-data:/data"]
    ports: ["3002:3002", "10005:10005"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3002"], interval: 15s, timeout: 3s, retries: 5 }
  execution:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: execution, BIN: execution } }
    environment: { SERVICE_LOG_DIR: /var/log/app, POSITION_MANAGEMENT_RSOCKET_URL: ws://position-management:10005, EXECUTION_RSOCKET_PORT: 10006 }
    volumes: ["../logs:/var/log/app"]
    ports: ["3003:3003", "10006:10006"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3003"], interval: 15s, timeout: 3s, retries: 5 }
  insights:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: insights, BIN: insights } }
    environment: { SERVICE_LOG_DIR: /var/log/app, BINANCE_FEED_RSOCKET_URL: ws://binance-feed:10002, FEED_HANDLERS_RSOCKET_URL: ws://feed-handlers:10001, POSITION_MANAGEMENT_RSOCKET_URL: ws://position-management:10005, AUTO_TRADER_RSOCKET_URL: ws://auto-trader:10006, INSIGHTS_RPC_RSOCKET_PORT: 10007, INSIGHTS_BROWSER_RSOCKET_PORT: 10011, NEWS_SENTIMENT_RSOCKET_URL: ws://news-sentiment:10012/rsocket, LEARNING_RSOCKET_URL: ws://learning:10010, SIGNALS_FILE: /data/signals.jsonl, INSIGHTS_RESEARCH_ONLY: "true" }
    volumes: ["../logs:/var/log/app", "insights-data:/data"]
    depends_on: [binance-feed, news-sentiment]
    ports: ["3004:3004", "10004:10004", "10011:10011"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3004"], interval: 15s, timeout: 3s, retries: 5 }
  live-signals:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: live_signals, BIN: live_signals } }
    environment: { SERVICE_LOG_DIR: /var/log/app, INSIGHTS_RSOCKET_URL: ws://insights:10004, INSIGHTS_RPC_RSOCKET_URL: ws://insights:10007, AUTO_TRADER_RSOCKET_URL: ws://auto-trader:10006, LEARNING_RSOCKET_URL: ws://learning:10010 }
    depends_on: [feed-handlers, insights, auto-trader, learning]
    volumes: ["../logs:/var/log/app"]
    ports: ["3007:3007"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3007"], interval: 15s, timeout: 3s, retries: 5 }
  insights-maintenance:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: insights, BIN: insights-maintenance } }
    environment: { SERVICE_LOG_DIR: /var/log/app, SIGNALS_FILE: /data/signals.jsonl }
    volumes: ["../logs:/var/log/app", "insights-data:/data"]
    depends_on: { insights: { condition: service_healthy } }
    restart: unless-stopped
  auto-trader:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: auto_trader, BIN: auto_trader } }
    environment: { SERVICE_LOG_DIR: /var/log/app, AUTO_TRADER_RSOCKET_PORT: 10006, AUTO_TRADER_LIVE_CONTEXT_REFRESH_SECONDS: "${AUTO_TRADER_LIVE_CONTEXT_REFRESH_SECONDS:-30}", AUTO_TRADER_MAX_PENDING_LIVE_SYMBOLS: "${AUTO_TRADER_MAX_PENDING_LIVE_SYMBOLS:-4096}", POSITION_MANAGEMENT_RSOCKET_URL: ws://position-management:10005, INSIGHTS_RPC_RSOCKET_URL: ws://insights:10007, INSIGHTS_BROWSER_RSOCKET_URL: ws://insights:10011, LEARNING_RSOCKET_URL: ws://learning:10010, AUTO_TRADER_STATE_FILE: /data/auto_trader_state.json }
    volumes: ["../logs:/var/log/app", "position-management-data:/data"]
    depends_on: [position-management, insights]
    ports: ["3005:3005", "10008:10006"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3005"], interval: 15s, timeout: 3s, retries: 5 }
  news-sentiment:
    build: { context: ../src/rust/insights, dockerfile: scripts/Dockerfile.news-sentiment }
    environment: { NEWS_SENTIMENT_HOST: 0.0.0.0, NEWS_SENTIMENT_OPS_PORT: 3006, NEWS_SENTIMENT_RSOCKET_PORT: 10012, HF_HOME: /models }
    volumes: ["news-models:/models"]
    ports: ["3006:3006"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3006/health')"], interval: 30s, timeout: 5s, retries: 5, start_period: 120s }
  learning:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: learning, BIN: learning } }
    environment:
      LEARNING_LISTEN_ADDR: 0.0.0.0:3010
      LEARNING_RSOCKET_LISTEN_ADDR: 0.0.0.0:10010
      LEARNING_STATE_FILE: /data/learning_state.sqlite
      SCOUT_WORKERS_ENABLED: ${SCOUT_WORKERS_ENABLED:-true}
      SCOUT_COORDINATOR_MAX_BATCH_SIGNALS: ${SCOUT_COORDINATOR_MAX_BATCH_SIGNALS:-64}
      SCOUT_COORDINATOR_MAX_ASSIGNMENTS: ${SCOUT_COORDINATOR_MAX_ASSIGNMENTS:-512}
      SCOUT_COORDINATOR_MAX_BATCH_BYTES: ${SCOUT_COORDINATOR_MAX_BATCH_BYTES:-8388608}
      SCOUT_COORDINATOR_WORKER_TIMEOUT_MS: ${SCOUT_COORDINATOR_WORKER_TIMEOUT_MS:-3000}
      SCOUT_WORKER_ENDPOINTS: "live-momentum=ws://scout-worker-live-momentum:10200;live-trade-flow=ws://scout-worker-live-trade-flow:10200;live-order-book=ws://scout-worker-live-order-book:10200;live-vwap-dislocation=ws://scout-worker-live-vwap-dislocation:10200;live-absorption-pressure=ws://scout-worker-live-absorption-pressure:10200;donchian-55-btc200=ws://scout-worker-donchian-55-btc200:10200;donchian-20-sma200=ws://scout-worker-donchian-20-sma200:10200;donchian-20-btc200=ws://scout-worker-donchian-20-btc200:10200;donchian-10-btc200=ws://scout-worker-donchian-10-btc200:10200;donchian-20-btc200-hold3=ws://scout-worker-donchian-20-btc200-hold3:10200;risk-adjusted-trend-portfolio=ws://scout-worker-risk-adjusted-trend-portfolio:10200;trend-sleeves-btc200=ws://scout-worker-trend-sleeves-btc200:10200;trend-50-200=ws://scout-worker-trend-50-200:10200;relative-strength-90-sma200=ws://scout-worker-relative-strength-90-sma200:10200;risk-adjusted-monthly-momentum=ws://scout-worker-risk-adjusted-monthly-momentum:10200;rsi2-oversold-rebound=ws://scout-worker-rsi2-oversold-rebound:10200;dated-futures-carry=ws://scout-worker-dated-futures-carry:10200"
    volumes: ["learning-data:/data"]
    ports: ["3010:3010", "10010:10010"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3010"], interval: 15s, timeout: 3s, retries: 5 }
  scouts:
    build: { context: .., dockerfile: system/Dockerfile.rust, args: { CRATE: scouts, BIN: scouts } }
    environment: { SCOUTS_LISTEN_ADDR: 0.0.0.0:3011 }
    ports: ["3011:3011"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3011"], interval: 15s, timeout: 3s, retries: 5 }
  scout-worker-live-momentum:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: live-momentum, SCOUT_WORKER_STATE_PATH: /data/workers/live-momentum.sqlite }
  scout-worker-live-trade-flow:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: live-trade-flow, SCOUT_WORKER_STATE_PATH: /data/workers/live-trade-flow.sqlite }
  scout-worker-live-order-book:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: live-order-book, SCOUT_WORKER_STATE_PATH: /data/workers/live-order-book.sqlite }
  scout-worker-live-vwap-dislocation:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: live-vwap-dislocation, SCOUT_WORKER_STATE_PATH: /data/workers/live-vwap-dislocation.sqlite }
  scout-worker-live-absorption-pressure:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: live-absorption-pressure, SCOUT_WORKER_STATE_PATH: /data/workers/live-absorption-pressure.sqlite }
  scout-worker-donchian-55-btc200:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: donchian-55-btc200, SCOUT_WORKER_STATE_PATH: /data/workers/donchian-55-btc200.sqlite }
  scout-worker-donchian-20-sma200:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: donchian-20-sma200, SCOUT_WORKER_STATE_PATH: /data/workers/donchian-20-sma200.sqlite }
  scout-worker-donchian-20-btc200:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: donchian-20-btc200, SCOUT_WORKER_STATE_PATH: /data/workers/donchian-20-btc200.sqlite }
  scout-worker-donchian-10-btc200:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: donchian-10-btc200, SCOUT_WORKER_STATE_PATH: /data/workers/donchian-10-btc200.sqlite }
  scout-worker-donchian-20-btc200-hold3:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: donchian-20-btc200-hold3, SCOUT_WORKER_STATE_PATH: /data/workers/donchian-20-btc200-hold3.sqlite }
  scout-worker-risk-adjusted-trend-portfolio:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: risk-adjusted-trend-portfolio, SCOUT_WORKER_STATE_PATH: /data/workers/risk-adjusted-trend-portfolio.sqlite }
  scout-worker-trend-sleeves-btc200:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: trend-sleeves-btc200, SCOUT_WORKER_STATE_PATH: /data/workers/trend-sleeves-btc200.sqlite }
  scout-worker-trend-50-200:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: trend-50-200, SCOUT_WORKER_STATE_PATH: /data/workers/trend-50-200.sqlite }
  scout-worker-relative-strength-90-sma200:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: relative-strength-90-sma200, SCOUT_WORKER_STATE_PATH: /data/workers/relative-strength-90-sma200.sqlite }
  scout-worker-risk-adjusted-monthly-momentum:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: risk-adjusted-monthly-momentum, SCOUT_WORKER_STATE_PATH: /data/workers/risk-adjusted-monthly-momentum.sqlite }
  scout-worker-rsi2-oversold-rebound:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: rsi2-oversold-rebound, SCOUT_WORKER_STATE_PATH: /data/workers/rsi2-oversold-rebound.sqlite }
  scout-worker-dated-futures-carry:
    <<: *scout-worker-base
    environment: { <<: *scout-worker-env, SCOUT_WORKER_STRATEGY: dated-futures-carry, SCOUT_WORKER_STATE_PATH: /data/workers/dated-futures-carry.sqlite }
  web:
    build: { context: .., dockerfile: system/Dockerfile.web }
    working_dir: /app/apps/react-app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    volumes:
      - "${REPO_ROOT:-..}/src/typescript/workspace/apps/react-app:/app/apps/react-app"
      - /app/apps/react-app/node_modules
    environment:
      VITE_RSOCKET_URL: ws://localhost:10001
      VITE_INSIGHTS_RSOCKET_URL: ws://localhost:10004
      VITE_INSIGHTS_BROWSER_RSOCKET_URL: ws://localhost:10011
      VITE_POSITION_RSOCKET_URL: ws://localhost:10005
      VITE_EXECUTION_RSOCKET_URL: ws://localhost:10006
      VITE_AUTO_TRADER_RSOCKET_URL: ws://localhost:10008
      VITE_LEARNING_RSOCKET_URL: ws://localhost:10010
    ports: ["5173:5173"]
    restart: unless-stopped
volumes:
  news-models:
  position-management-data:
    name: sbe-position-management-data
  insights-data:
    name: sbe-insights-data
  learning-data:
    name: sbe-learning-data
  scouts-state:
    name: sbe-scouts-state
